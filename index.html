<!DOCTYPE html>
<html lang="en" class="scroll-smooth" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mayabits — Crafting Digital Realities</title>
  <meta name="description" content="Mayabits is a product studio crafting digital realities — beautiful, user-friendly apps that solve real-world problems." />
  <meta name="theme-color" content="#07070a" />

  <!-- Theme: saved choice, else the system preference. Runs before paint to avoid a flash. -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      var theme = saved === "light" || saved === "dark" ? saved
        : window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", theme);
      document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "light" ? "#fafafc" : "#07070a");
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3C/svg%3E" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind.config.js"></script>

  <!-- Custom styles -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="bg-ink font-sans text-zinc-100 antialiased selection:bg-indigo-500/40">

  <!-- 3D background (Three.js) -->
  <canvas id="scene" class="pointer-events-none fixed inset-0 -z-10 h-full w-full" aria-hidden="true"></canvas>
  <div class="pointer-events-none fixed inset-0 -z-10 bg-grid"></div>

  <!-- Navbar -->
  <header id="navbar" class="fixed inset-x-0 top-0 z-50 transition-all duration-300">
    <nav class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4 sm:px-6">
      <a href="#/" class="flex items-center gap-2.5">
        <span class="logo-badge" data-bind="companyInitial">M</span>
        <span class="font-display text-lg font-semibold tracking-tight" data-bind="company">Mayabits</span>
      </a>

      <ul class="hidden items-center gap-1 rounded-full border border-white/10 bg-white/[0.03] p-1 text-sm font-medium text-zinc-400 backdrop-blur md:flex">
        <li><a href="#/" class="nav-link">Home</a></li>
        <li><a href="#mission" class="nav-link">About</a></li>
        <li><a href="#apps" class="nav-link">Apps</a></li>
        <li><a href="#contact" class="nav-link">Contact</a></li>
      </ul>

      <div class="flex items-center gap-2">
        <button class="theme-toggle" data-theme-toggle aria-label="Toggle light and dark theme" title="Toggle theme">
          <svg class="icon-moon h-[18px] w-[18px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun h-[18px] w-[18px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <a href="#contact" class="btn-primary hidden md:inline-flex">Get in touch</a>

      <button id="menuBtn" class="rounded-lg p-2 text-zinc-300 hover:bg-white/10 md:hidden" aria-label="Open menu" aria-expanded="false">
        <svg class="menu-open h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/></svg>
        <svg class="menu-close hidden h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      </div>
    </nav>

    <div id="mobileMenu" class="hidden border-t border-white/10 bg-ink/95 backdrop-blur md:hidden">
      <ul class="space-y-1 px-4 py-3 text-sm font-medium text-zinc-300">
        <li><a href="#/" class="block rounded-lg px-3 py-2 hover:bg-white/5">Home</a></li>
        <li><a href="#mission" class="block rounded-lg px-3 py-2 hover:bg-white/5">About</a></li>
        <li><a href="#apps" class="block rounded-lg px-3 py-2 hover:bg-white/5">Apps</a></li>
        <li><a href="#contact" class="block rounded-lg px-3 py-2 hover:bg-white/5">Contact</a></li>
      </ul>
    </div>
    <div class="scroll-progress" aria-hidden="true"></div>
  </header>

  <!-- Pages (home, app, privacy) are rendered here by js/router.js -->
  <main id="view"></main>

  <!-- Footer -->
  <footer class="relative border-t border-white/5 bg-ink/80 backdrop-blur">
    <div class="mx-auto grid max-w-6xl gap-10 px-4 py-14 sm:grid-cols-2 sm:px-6 lg:grid-cols-4">
      <div class="lg:col-span-2">
        <a href="#/" class="flex items-center gap-2.5">
          <span class="logo-badge" data-bind="companyInitial">M</span>
          <span class="font-display font-semibold" data-bind="company">Mayabits</span>
        </a>
        <p class="mt-4 max-w-sm text-sm leading-relaxed text-zinc-500" data-bind="tagline"></p>
      </div>
      <div>
        <h4 class="text-sm font-semibold text-zinc-200">Our Apps</h4>
        <ul id="footerApps" class="mt-4 space-y-2.5 text-sm text-zinc-500"></ul>
      </div>
      <div>
        <h4 class="text-sm font-semibold text-zinc-200">Privacy Policies</h4>
        <ul id="footerPolicies" class="mt-4 space-y-2.5 text-sm text-zinc-500"></ul>
      </div>
    </div>
    <div class="border-t border-white/5">
      <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-2 px-4 py-6 text-sm text-zinc-500 sm:flex-row sm:px-6">
        <p>&copy; <span data-bind="year"></span> <span data-bind="company">Mayabits</span>. All rights reserved.</p>
        <p>Developer contact: <a data-bind="emailLink" href="#" class="text-zinc-300 hover:text-white"></a></p>
      </div>
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
